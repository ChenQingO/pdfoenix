# Default pdfoenix configuration.  A book's config.toml may override any key;
# missing keys are filled from these values by core.config.load_config.
# This file is a human-readable reference kept in sync with DEFAULT_CONFIG
# (tests/test_presets.py enforces the sync).

[book]
title = ""
author = ""
pdf = ""
page_offset = 0

[pipeline]
batch_pages = 5
render_dpi = 150
verify_dpi = 300
verify_chunk_size = 5

[transcriber]
timeout = 3600
attempts = 3
retry_delay = 2.0

# Model wiring: the pair behind the two billed agents.  Combo 1 is the
# benchmark's value sweet spot and ships by default.  Add combos by hand —
# they are immutable, so create a new id to change a pair.  Keys are never
# stored: export the declared api_key_env instead.
[expt]
pages = ""
max_workers = 2
attempts = 4
active = 1

[[expt.provider]]
name = "mimo"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"

[[expt.provider]]
name = "deepseek"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[[expt.combo]]
id = 1
transcribe = "mimo/mimo-v2.6-pro"
verify = "deepseek/deepseek-flash#high"

[sampling]
strategy = "risk_distribution"
page_risk = "max"
budget = "20%"
low_max = 50
high_min = 125
low_prob = 0.01
medium_prob = 0.09
high_prob = 0.60
min_pages = 10
min_rate = 0.10
seed = 0

[sampling.risk_weights]
sub_sup = 2
frac = 3
hat = 3
bold = 2
matrix = 5
bigop = 2

[review]
global_audit = true
