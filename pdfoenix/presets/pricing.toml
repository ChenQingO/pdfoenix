# Model prices in USD per 1,000,000 tokens.
#
# Add one table per model id as recorded in logs/pipeline.db.  Prices are applied
# at report time, so changing this file never rewrites historical token data.
#
# Sources: the rates published by the model gateway (2026-10-22).  The gateway
# quotes one input rate; input_vision is billed at the same rate as input_text,
# and the adapter currently records every input token as input_text anyway.

[pricing."mimo-v2.6-flash"]
input_text = 0.14
input_vision = 0.14
output = 0.28

[pricing."mimo-v2.6-pro"]
input_text = 0.435
input_vision = 0.435
output = 0.87

[pricing."mimo-v2.6-pro-ultraspeed"]
input_text = 4.35
input_vision = 4.35
output = 8.7

[pricing."deepseek-v4-pro"]
input_text = 0.66
input_vision = 0.66
output = 1.98

[pricing."deepseek-flash"]
input_text = 0.15
input_vision = 0.15
output = 0.6

