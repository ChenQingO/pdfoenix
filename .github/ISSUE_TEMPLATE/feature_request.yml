name: Feature request
description: Propose a focused improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing, or unreliable today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change and how it fits the deterministic-first design.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional; note any simpler option or configuration-only solution.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not require committing a real book or API key.
          required: true
