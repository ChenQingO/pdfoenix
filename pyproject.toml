[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfoenix"
version = "0.1.0"
description = "Scanned PDF to modern EPUB pipeline"
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.24", "rich>=13"]

[project.scripts]
pdfoenix = "pdfoenix.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pylint>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "A", "SIM", "RET", "ARG", "UP", "RUF"]

[tool.setuptools.packages.find]
include = ["pdfoenix*"]

[tool.setuptools.package-data]
pdfoenix = ["presets/*"]
