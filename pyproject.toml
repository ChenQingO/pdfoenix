[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfoenix"
dynamic = ["version"]
description = "Scanned PDF to modern EPUB pipeline"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "ChenHingO" }]
keywords = ["pdf", "epub", "ocr", "llm", "pandoc", "mathematics", "book"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
dependencies = ["pymupdf>=1.24", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pylint>=3"]

[project.scripts]
pdfoenix = "pdfoenix.cli:main"

[project.urls]
Homepage = "https://github.com/ChenQingO/pdfoenix"
Repository = "https://github.com/ChenQingO/pdfoenix"
Issues = "https://github.com/ChenQingO/pdfoenix/issues"
Changelog = "https://github.com/ChenQingO/pdfoenix/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "pdfoenix.__version__" }

[tool.setuptools.packages.find]
include = ["pdfoenix*"]

[tool.setuptools.package-data]
pdfoenix = ["presets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "A", "SIM", "RET", "ARG", "UP", "RUF"]
